[project]
name = "mcp-agents-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandre Furlan", email = "alexandrepfurlan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3",
    "ollama>=0.6.2",
]

[project.scripts]
mcp-agents-lab = "mcp_agents_lab:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
